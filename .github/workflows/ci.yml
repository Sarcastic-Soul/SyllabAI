name: SyllabAI Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Run Vitest Unit Tests
        run: pnpm exec vitest run

      - name: Build Next.js project
        env:
          NEON_AUTH_BASE_URL: https://example.neonauth.dev/neondb/auth
          NEON_AUTH_COOKIE_SECRET: dummy_cookie_secret_at_least_32_chars_long
          DATABASE_URL: postgresql://user:pass@localhost:5432/db?sslmode=require
          GEMINI_API_KEY: dummy_key
        run: pnpm build
